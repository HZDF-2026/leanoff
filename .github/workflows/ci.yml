name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Orchestration unit tests (stubbed run_lean)
        run: python -m unittest tests.test_leanoff
        env:
          PYTHONUTF8: "1"

  go:
    name: Go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.21", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Unit tests (incl. race detector)
        run: go test ./...

  cpp:
    name: C++ ${{ matrix.cc }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: g++
            mk: make
          - os: macos-latest
            cc: clang++
            mk: make
          - os: windows-latest
            cc: g++
            mk: mingw32-make
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        if: runner.os == 'Windows'
        run: choco install -y mingw
      - name: Reference-table tests
        run: ${{ matrix.mk }} -C cpp CXX=${{ matrix.cc }} test

  diff:
    name: Differential (Python vs Go vs C++) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install MinGW
        if: runner.os == 'Windows'
        run: choco install -y mingw
      - name: Build Go binary
        run: go build -o dist/go/leanoff${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/leanoff
      - name: Build C++ binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mingw32-make -C cpp
          else
            make -C cpp
          fi
      - name: Differential harness (Go vs Python, C++ vs Python)
        run: |
          python tests/diff_go.py
          python tests/diff_cpp.py
        env:
          PYTHONUTF8: "1"

  lean:
    name: Lean 4 proofs (Mathlib v4.32.2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MATHLIB_DIR: /tmp/mathlib
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain 4.32.2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone Mathlib
        run: git clone --depth 1 --branch v4.32.2 https://github.com/leanprover-community/mathlib4.git "$MATHLIB_DIR"
      - name: Cache Mathlib oleans
        # restore after the clone: a cache hit pre-creates /tmp/mathlib and
        # git clone into a non-empty directory fails
        uses: actions/cache@v4
        with:
          path: /tmp/mathlib/.lake
          key: mathlib-oleans-v4.32.2
      - name: Fetch Mathlib
        run: |
          cd "$MATHLIB_DIR"
          lake exe cache get
          lake build
      - name: Verify proofs (no sorry, no errors)
        run: |
          cd "$MATHLIB_DIR"
          status=0
          out=$(lake env lean "$GITHUB_WORKSPACE/proofs/TopoLevels.lean" 2>&1) || status=1
          errors=$(printf '%s\n' "$out" | grep -c ': error' || true)
          sorries=$(printf '%s\n' "$out" | grep -c "uses 'sorry'" || true)
          echo "TopoLevels.lean: errors=$errors sorry=$sorries"
          printf '%s\n' "$out" | grep ': error' || true
          [ "$errors" -eq 0 ] && [ "$sorries" -eq 0 ] || status=1
          exit $status
